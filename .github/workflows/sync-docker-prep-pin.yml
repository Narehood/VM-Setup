name: Sync Docker-Prep pin

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Docker-Prep release tag to pin (defaults to latest)"
        required: false
        type: string
  repository_dispatch:
    types: [docker-prep-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-docker-prep-pin
  cancel-in-progress: true

jobs:
  sync-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_RELEASE_TAG:-}"
          skip=false

          if [[ -z "$tag" && "$EVENT_NAME" == "repository_dispatch" ]]; then
            tag="${CLIENT_PAYLOAD_TAG:-}"
            if [[ -z "$tag" ]]; then
              echo "repository_dispatch is missing client_payload.tag" >&2
              exit 1
            fi
          fi

          if [[ -z "$tag" ]]; then
            api_err=$(mktemp)
            if ! tag=$(gh api repos/Narehood/Docker-Prep/releases/latest --jq '.tag_name' 2>"$api_err"); then
              err=$(cat "$api_err" || true)
              rm -f -- "$api_err"
              if grep -qiE 'Not Found|HTTP 404' <<<"$err"; then
                echo "No GitHub Releases exist yet in Narehood/Docker-Prep."
                echo "Tag a release (v*) there, or re-run this workflow with release_tag."
                if [[ "$EVENT_NAME" == "schedule" ]]; then
                  echo "Scheduled sync has nothing to do until the first release exists."
                  skip=true
                else
                  echo "$err" >&2
                  exit 1
                fi
              else
                echo "$err" >&2
                exit 1
              fi
            else
              rm -f -- "$api_err"
            fi
          fi

          {
            echo "tag=${tag:-}"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      - name: Update pin and checksums
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          bash tools/sync-docker-prep-pin.sh "$RELEASE_TAG"

      - name: Validate repository security checks
        if: steps.release.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y shellcheck ripgrep
          bash tests/security-checks.sh
          shellcheck --severity=error \
            install.sh \
            Installers/*.sh \
            tests/*.sh \
            tools/*.sh

      - name: Create or update pull request
        if: steps.release.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump Docker-Prep pin to ${{ steps.release.outputs.tag }}"
          title: "Bump Docker-Prep pin to ${{ steps.release.outputs.tag }}"
          body-path: .docker-prep-pin-update.md
          branch: cursor/docker-prep-pin-${{ steps.release.outputs.tag }}
          delete-branch: true
          add-paths: |
            Installers/Docker-Prep.sh
            Installers/.checksums.sha256
